<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ song.meta.title }}</title>
    <link rel="stylesheet" href="../assets/stylesheet.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>
    <header id="song-header">
        <div id="song-header-buttons">
            <a class="button" href="../index.html">
                <i class="bi bi-music-note-list"></i>
            </a>

            <button id="transpose-toggle" class="button">
                <i class="bi bi-sliders"></i>
            </button>
            <div id="transpose-box" class="hidden">
                <button id="transpose-reset" class="button"><i class="bi bi-record-circle"></i></button>
                <div id="transpose-show">0</div>
                <button id="transpose-down" class="button"><i class="bi bi-dash-circle"></i></button>
                <button id="transpose-up" class="button"><i class="bi bi-plus-circle"></i></button>
            </div>
        </div>
        <div id="song-header-title">
            <h1 id="song-title">{{ song.meta.title }}</h1>
            {% if song.meta.subtitle %}
            <h2 id="song-subtitle">{{ song.meta.subtitle }}</h2>
            {% endif %}
            {% if song.meta.artist %}
            <span id="song-artist">{{ song.meta.artist | join(", ") }}</span>
            {% endif %}
        </div>
        <div id="song-header-meta">
            {% if song.meta.capo %}
            <span id="song-meta-capo">
                <span>Capo </span>
                <span>{{ song.meta.capo }}</span>
            </span>
            {% endif %}
        </div>
    </header>

    <main id="song-content">
        {{ rendered_content | safe }}
    </main>

    <script src="../assets/chord_transpositions.js"></script>
</body>

</html>
