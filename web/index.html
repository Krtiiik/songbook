<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <title>Zpěvník</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/song.css">
    <script src="vendor/svguitar.umd.js"></script>
    <script type="module" src="js/main.js"></script>
</head>

<body data-view="loading">
    <!-- Icons: line icons on a 24px grid, drawn with currentColor (see .icon in base.css) --->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
        <symbol id="i-pdf" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></symbol>
        <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
        <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></symbol>
        <symbol id="i-back" viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5"/></symbol>
        <symbol id="i-next" viewBox="0 0 24 24"><path d="m9.5 5.5 6.5 6.5-6.5 6.5"/></symbol>
        <symbol id="i-random" viewBox="0 0 24 24"><path d="M3 7h3.5c5 0 5 10 10 10H21M3 17h3.5c1.8 0 3-.9 4-2.2M13.5 8.8C14.5 7.6 15.7 7 17 7h4M18.5 4.5 21 7l-2.5 2.5M18.5 14.5 21 17l-2.5 2.5"/></symbol>
        <symbol id="i-transpose" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></symbol>
        <symbol id="i-text-size" viewBox="0 0 24 24"><path d="M3 19 8.5 6 14 19M5 14.5h7M16 19l2.5-6 2.5 6M17 17h3"/></symbol>
        <symbol id="i-columns" viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="16" rx="1.5"/><path d="M9.2 4v16M14.8 4v16"/></symbol>
        <symbol id="i-chords" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="1.5"/><path d="M5 9h14M5 15h14M12 3v18"/></symbol>
        <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3"/></symbol>
        <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
        <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
        <symbol id="i-external" viewBox="0 0 24 24"><path d="M13.5 4H20v6.5M20 4l-9 9"/><path d="M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></symbol>
        <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
        <symbol id="i-reset"viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.5-5.8M4 4v4.5h4.5"/></symbol>
        <symbol id="i-settings" viewBox="0 0 24 24"><path d="M10.21 4.82L10.5 2.52L13.5 2.52L13.79 4.82L15.81 5.66L17.64 4.23L19.77 6.36L18.34 8.19L19.18 10.21L21.48 10.5L21.48 13.5L19.18 13.79L18.34 15.81L19.77 17.64L17.64 19.77L15.81 18.34L13.79 19.18L13.5 21.48L10.5 21.48L10.21 19.18L8.19 18.34L6.36 19.77L4.23 17.64L5.66 15.81L4.82 13.79L2.52 13.5L2.52 10.5L4.82 10.21L5.66 8.19L4.23 6.36L6.36 4.23L8.19 5.66z"/><circle cx="12" cy="12" r="3"/></symbol>
        <symbol id="i-system" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="12" rx="1.5"/><path d="M9 20h6M12 16.5V20"/></symbol>
    </svg>

    <!-- Settings: a modal opened from the gear in either top bar ------------------------>
    <dialog id="settings-dialog" aria-labelledby="settings-title">
        <div class="dialog-body">
            <header class="dialog-bar">
                <button id="settings-back" class="button hidden" title="Zpět" aria-label="Zpět"><svg class="icon" aria-hidden="true"><use href="#i-back"/></svg></button>
                <h2 id="settings-title">Nastavení</h2>
                <button id="settings-close" class="button" title="Zavřít" aria-label="Zavřít"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button>
            </header>

            <section id="settings-root" class="settings-page">
                <div class="settings-group">
                    <div class="settings-label">Vzhled</div>
                    <div id="theme-choice" class="segmented" role="group" aria-label="Vzhled">
                        <button class="segment" data-choice="light" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-sun"/></svg>Světlý</button>
                        <button class="segment" data-choice="dark" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-moon"/></svg>Tmavý</button>
                        <button class="segment" data-choice="system" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-system"/></svg>Systém</button>
                    </div>
                </div>
                <button id="open-tuner" class="settings-link">
                    <svg class="icon" aria-hidden="true"><use href="#i-mic"/></svg>
                    <span>Ladička</span>
                    <svg class="icon" aria-hidden="true"><use href="#i-next"/></svg>
                </button>
            </section>

            <section id="settings-tuner" class="settings-page hidden">
                <select id="tuner-instrument" class="control-select" aria-label="Nástroj">
                    <option value="guitar">Kytara</option>
                    <option value="bass">Baskytara</option>
                    <option value="ukulele">Ukulele</option>
                    <option value="violin">Housle</option>
                    <option value="cello">Violoncello</option>
                    <option value="banjo">Banjo</option>
                    <option value="mandolin">Mandolína</option>
                    <option value="chromatic">Chromatická</option>
                </select>
                <div id="tuner-target-note">-</div>
                <div id="tuner-bar">
                    <div id="tuner-bar-fill"></div>
                    <div id="tuner-bar-marker"></div>
                </div>
                <div id="tuner-label">-</div>
                <div id="tuner-status"><svg class="icon" aria-hidden="true"><use href="#i-mic"/></svg><span></span></div>
            </section>
        </div>
    </dialog>

    <!-- Song list ------------------------------------------------------------------>
    <header id="index-header" class="topbar">
        <div class="topbar-side">
            <a id="pdf-link" class="button hidden" href="songbook.pdf" title="PDF" aria-label="PDF"><svg class="icon" aria-hidden="true"><use href="#i-pdf"/></svg></a>
            <button class="button settings-toggle" title="Nastavení" aria-label="Nastavení" aria-haspopup="dialog"><svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg></button>
        </div>
        <h1 id="index-title"></h1>
        <div class="topbar-side topbar-end"></div>
    </header>

    <main id="index">
        <label id="search-box">
            <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
            <input id="search-input" type="search" autocomplete="off" aria-label="Hledat píseň" placeholder="Název nebo interpret">
            <span id="search-count" class="chip"></span>
            <button id="search-clear" class="button" type="button" title="Smazat hledání" aria-label="Smazat hledání"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button>
        </label>
        <nav id="song-list" aria-label="Seznam písní"></nav>
    </main>
    <nav id="letter-rail" aria-label="Přejít na písmeno"></nav>
    <div id="letter-bubble" class="hidden" aria-hidden="true"></div>

    <!-- Song ----------------------------------------------------------------------->
    <header id="song-topbar" class="topbar">
        <div class="topbar-side">
            <a id="index-link" class="button" href="#" title="Seznam písní" aria-label="Seznam písní"><svg class="icon" aria-hidden="true"><use href="#i-back"/></svg></a>
            <button class="button settings-toggle" title="Nastavení" aria-label="Nastavení" aria-haspopup="dialog"><svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg></button>
        </div>
        <div id="song-position"></div>
        <div class="topbar-side topbar-end">
            <button id="version-toggle" class="button hidden" aria-haspopup="true" aria-expanded="false"><span id="version-stack" aria-hidden="true"></span></button>
            <button id="random-song" class="button" title="Náhodná píseň" aria-label="Náhodná píseň"><svg class="icon" aria-hidden="true"><use href="#i-random"/></svg></button>
        </div>
    </header>

    <div id="song-page">
    <header id="song-header">
        <div id="song-heading">
            <h1 id="song-title"></h1>
            <h2 id="song-artist"></h2>
            <span id="song-capo" class="chip"></span>
        </div>
    </header>

    <main id="song-content"></main>
    </div>

    <button id="seek-previous" class="seek" title="Předchozí" aria-label="Předchozí píseň"><svg class="icon" aria-hidden="true"><use href="#i-back"/></svg></button>
    <button id="seek-next" class="seek" title="Další" aria-label="Další píseň"><svg class="icon" aria-hidden="true"><use href="#i-next"/></svg></button>

    <!-- Floating toolbar and the boxes it opens -------------------------------------->
    <div id="song-toolbar" role="toolbar" aria-label="Nástroje písně">
        <button id="transpose-toggle" class="tool" title="Transpozice" aria-label="Transpozice"><svg class="icon" aria-hidden="true"><use href="#i-transpose"/></svg></button>
        <button id="zoom-toggle" class="tool" title="Velikost písma" aria-label="Velikost písma"><svg class="icon" aria-hidden="true"><use href="#i-text-size"/></svg></button>
        <button id="columns-toggle" class="tool hidden" title="Sloupce" aria-label="Sloupce"><svg class="icon" aria-hidden="true"><use href="#i-columns"/></svg><span id="columns-badge" aria-hidden="true"></span></button>
        <button id="chords-toggle" class="tool" title="Akordy" aria-label="Akordy"><svg class="icon" aria-hidden="true"><use href="#i-chords"/></svg></button>
    </div>

    <!-- Opens under the top bar, from the version button -->
    <div id="version-box" class="popover slide hidden">
        <div id="song-versions" role="group" aria-label="Verze písně"></div>
        <a id="source-link" class="hidden" target="_blank" rel="noopener"><svg class="icon" aria-hidden="true"><use href="#i-external"/></svg>Originál</a>
    </div>

    <div id="transpose-box" class="popover hidden">
        <div class="popover-title">Transpozice</div>
        <div class="popover-row">
            <button id="transpose-reset" class="button" title="Původní tónina" aria-label="Původní tónina"><svg class="icon" aria-hidden="true"><use href="#i-reset"/></svg></button>
            <div id="transpose-show" class="control-value">0</div>
            <button id="transpose-down" class="button round" title="Níž" aria-label="Níž"><svg class="icon" aria-hidden="true"><use href="#i-minus"/></svg></button>
            <button id="transpose-up" class="button round" title="Výš" aria-label="Výš"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg></button>
        </div>
    </div>

    <div id="zoom-box" class="popover hidden">
        <div class="popover-title">Velikost písma</div>
        <div class="popover-row">
            <button id="zoom-reset" class="button" title="Výchozí velikost" aria-label="Výchozí velikost"><svg class="icon" aria-hidden="true"><use href="#i-reset"/></svg></button>
            <div id="zoom-show" class="control-value">100%</div>
            <button id="zoom-out" class="button round zoom-glyph" title="Menší" aria-label="Menší">A</button>
            <button id="zoom-in" class="button round zoom-glyph zoom-glyph-large" title="Větší" aria-label="Větší">A</button>
        </div>
    </div>

    <div id="chords-box" class="popover hidden"></div>
</body>

</html>
