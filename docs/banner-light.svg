    .d1{animation-delay:.1s} .d2{animation-delay:.25s} .d3{animation-delay:.4s} .d4{animation-delay:.5s}
    .rule{transform-box:fill-box;transform-origin:50% 0;animation:grow .7s cubic-bezier(.2,.7,.2,1) .6s both}
    .arrow{animation:nudge .9s ease-in-out 1.2s infinite alternate}
    @keyframes k1{0%,6.67%{opacity:0}9.58%,88.33%{opacity:1}95%,100%{opacity:0}}
