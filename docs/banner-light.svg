<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">Krtkův Zpěvník</title>
  <desc id="d">Songs with guitar chords. Open the songbook at krtiiik.github.io/songbook.</desc>

  <style>
    @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
