    <text x="706" y="134"><tspan class="a1">Dal</tspan> <tspan class="a3">bych</tspan> <tspan class="a4">si</tspan> <tspan class="a5">Bráníček,</tspan> <tspan class="a6">on</tspan> <tspan class="a8">draze</tspan> <tspan class="a9">jenom</tspan> <tspan class="a10">chutná.</tspan></text>
